description: |
  **Primary regression matrix** — codex 최대화 + opus 품질 검증 2-way.

  사용자 1순위: codex 의 분석/구현 품질을 opus baseline 과 같은 prompt 로
  비교 → "codex 가 opus 만큼 substantive 한가?" 측정. opus 는 quality
  reference 로만 호출 (codex 가 충분히 따라잡으면 opus rotation 비활성화
  가능).

  4provider-feature-impl.yaml 은 opus/xai/codex/gemini 4-way occasional
  sanity check — 일상 회귀는 본 scenario 위주.

  - 분석 (analysis): "디버깅 파이프라인 분석" — broad project understanding
  - 구현 (implementation): "src/index.ts 의 repro 명령에 --temperature
    option 추가 patch" — concrete code-write task

defaults:
  cwd: ../..
  asserts:
    text_min_chars: 800   # template fallback (~700 chars) 보다 충분히 위

prompts:
  # ── Analysis pair ─────────────────────────────────────────────
  - id: analysis-codex
    rotate: codex
    prompt: "이 프로젝트의 디버깅 파이프라인 분석해주세요"
    asserts:
      # codex 가 force-synthesis 거쳐도 substantive 답변이면 PASS.
      # exploration-fallback-emitted no_event 는 너무 strict — codex 의
      # 자연스러운 path 가 force-synthesis 라서 wave 6 cycle 에서 false
      # negative 너무 잦았음. text 길이로만 quality 평가.
      text_min_chars: 2500

  - id: analysis-opus
    rotate: opus
    prompt: "이 프로젝트의 디버깅 파이프라인 분석해주세요"
    asserts:
      text_min_chars: 1200

  # ── Implementation pair ───────────────────────────────────────
  - id: impl-codex
    rotate: codex
    prompt: |
      `src/index.ts` 의 `repro` 명령에 `--temperature <n>` 옵션을 추가하는
      patch 를 작성해 주세요. 요구사항:

      1. commander option: `--temperature <n>` (number)
      2. action handler 에서 `askOpts.temperature = parsed_n` 으로 전달
         (parseFloat + isFinite 검증)
      3. EvalPromptOpts (src/eval-prompt-cli.ts) 에 `temperature?: number`
         필드 추가 + runEvalPrompt 에서 streamLLMWithTools 의 opts 에
         그대로 패스
      4. 기존 default (없을 때 provider 기본값 0.3) 는 유지

      **출력**: 실제로 Edit 도구를 사용하지 말고, **답변 텍스트로 unified
      diff 형식의 patch + 한 단락 설명** 만 작성하세요.

  - id: impl-opus
    rotate: opus
    prompt: |
      `src/index.ts` 의 `repro` 명령에 `--temperature <n>` 옵션을 추가하는
      patch 를 작성해 주세요. 요구사항:

      1. commander option: `--temperature <n>` (number)
      2. action handler 에서 `askOpts.temperature = parsed_n` 으로 전달
         (parseFloat + isFinite 검증)
      3. EvalPromptOpts (src/eval-prompt-cli.ts) 에 `temperature?: number`
         필드 추가 + runEvalPrompt 에서 streamLLMWithTools 의 opts 에
         그대로 패스
      4. 기존 default (없을 때 provider 기본값 0.3) 는 유지

      **출력**: 실제로 Edit 도구를 사용하지 말고, **답변 텍스트로 unified
      diff 형식의 patch + 한 단락 설명** 만 작성하세요.
