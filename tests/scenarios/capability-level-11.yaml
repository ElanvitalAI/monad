description: |
  레벨 측정 도그푸드 — 11 문항 중 **9 문항**을 실행한다.
  ⛔⭐ **이 파일의 성공 = 문항 통과가 아니다** — asserts 는 **툴이 골라졌는가**만 본다.
     나머지 통과 기준은 실행 후 `elanous logs` 로 따로 판정한다(문서의 `판정` 칸이 canonical).
  (⛔ A5 · B2 는 **파일에 없다** — 둘 다 같은 세션 2턴이라야 재는 문항이고,
   여기 넣으면 재지도 못하면서 비용·로그 오염만 만든다. 아래에 이유를 적었다.
   파일명의 `11` 은 문항집 전체를 가리킨다.)

  canonical = docs/system/DOGFOOD-capability-level-scenarios-l2-l3-2026-07-28.md
  앵커      = PR #5730 본문 1순위 배너(궁극 목적 = 졸업)

  ⚠️ 발화는 verbatim 이다. 다듬으면 재는 대상이 바뀐다(문서 §0a) —
     "TUI 를 띄워라" 처럼 툴 이름을 흘리면 N2 가 아니라 N1 을 두 번 재게 된다.

  ⚠️⚠️ 이 파일의 asserts 는 **① 툴 선택 층만** 잰다. 나머지 통과 기준
     (파라미터 조합·세 갈래 판정·화면 대조·집행 효과)은 실행 후 `elanous logs`
     로 따로 판정한다. 문서의 `판정` 칸이 canonical.

  ⚠️ 단계 실행 — dry-run 이 없다. 툴이 선택되면 **실제로 돈다**:
     stage 1 (A1~A4)  관측만. 자식 안 뜬다. 싸다.
     stage 2 (B1·B3)  SelfImplement = 진짜 self-dev 런(길다·비싸다)
     stage 3 (C1~C3)  진짜 elanous TUI 자식 PTY

  ⛔ 이 파일은 **9 문항**이다 — A5·B2 가 빠져 있고, 그건 누락이 아니라 **판정**이다.
     "아까 그거"의 지시대명사 해소는 직전 턴과 세션이 이어져야 재는데 repro 의
     prompts 는 서로 독립이다. 넣으면 "잰 것처럼" 보이면서 아무것도 못 재는
     거짓 통과가 나온다. ⇒ B2 는 사다리 **B2 층(`elanous ask --session "$SESSION_ID"` 두 턴)** 에서
     따로 돌리고 회차 기록표의 같은 행에 적는다. 상세는 문서 §2-3(canonical).

  ⛔⭐ A5 도 **이 파일에 없다** (무인 리뷰 must-fix ② ⊕ ⑤ · 2026-07-28).
     문서판 발화("방금 판정 못 한 그거…")는 A4 의 답을 문맥으로 전제하는데 여기
     prompts 는 서로 독립이다. 종전 판에는 그 발화가 **문서판 그대로** 실려 있었고
     (자립형으로 바꾼 것이 아니다) 그래서 "방금 그거"가 아무것도 안 가리켰다. 그건
     **A5 를 온전히 재지 못하면서**(셀프힐링의 "직전 판정을 이어받는" 부분이 빠진다)
     ⛔ **진짜 self-dev 자식은 띄운다** ⇒ 얻는 것 없이 (a) 비용 (b) 로그 오염만 남고,
     그 SelfImplement 호출이 B1·B3 의 판정 창에 섞여 **서로를 통과시킨다**
     (문서 §2-7 문항별 경계). ⇒ **뺐다.**
     A5 의 정본 계측기도 B2 와 같은 **같은 세션 2턴**이다(문서 §2-3).

  ⇒ ⭐ **커버리지: 11 문항 중 9 실행 · 자동 채점은 "툴 선택 하위항"만**
     실행  = A1 · A2 · A3 · A4 · B1 · B3 · C1 · C2 · C3
     파일에 없음 = A5 · B2 (둘 다 같은 세션 2턴 계측기 — 문서 §2-3)

  실행:
    bun bin/elanous.mjs repro --test --tools webterm --max-turns 8 --json \
      --scenario tests/scenarios/capability-level-11.yaml --concurrency 1

defaults:
  max_turns: 8
  asserts:
    text_min_chars: 100

prompts:
  # ── A. L2 기본 관측·자기인지 (자식 없음) ────────────────────────────────
  - id: A1-self-log-query
    prompt: "방금 5분 동안 나한테 무슨 에러 났는지 로그로 봐줘"
    asserts:
      tool_min: { logs_query: 1 }

  - id: A2-choose-filters
    prompt: "요즘 self-implement 쪽에서 실패한 게 있나? 필요한 필터는 알아서 골라줘"
    asserts:
      tool_min: { logs_query: 1 }

  - id: A3-memory-vs-logs
    prompt: "내가 어제 뭘 바꿨는지 기억하고 있나? 그거랑 지금 로그가 아귀가 맞는지 봐줘"
    asserts:
      tool_min: { self_recall: 1, logs_query: 1 }

  - id: A4-absence-vs-uninstrumented
    prompt: |
      이 기능이 진짜 도는지 로그로 확인해줘.
      로그에 안 나오면 '안 도는 것'인지 '계측이 없는 것'인지 구분해서 말해줘
    asserts:
      tool_min: { logs_query: 1 }
      text_min_chars: 200

  # ── stage 2 — 진짜 self-dev 자식이 뜬다 ─────────────────────────────────
  # ⛔⭐ A5 는 이 파일에서 **실행하지 않는다** (무인 리뷰 must-fix ⑤ · 2026-07-28).
  #    종전 판에는 문서판 발화가 그대로 들어 있었고(자립형이 아니었다), 비채점이면서
  #    **진짜 self-dev 자식을 띄운다**.
  #    ⇒ 얻는 것 없이 (a) 비용 (b) 로그 오염만 남는다 — 그 SelfImplement 호출이
  #      B1·B3 의 판정 창에 섞여 **서로를 통과시킨다**(§2-7 문항별 경계).
  #    정본 계측기는 **같은 세션 2턴**(A4 → A5)이고 명령과 발화 원문은 **문서 §2-3 이 canonical**.
  #    ⛔ 여기에 발화를 옮겨 적지 않는다 — 사본이 둘이면 갈리고, 실제로 갈려서
  #       줄인 발화가 실렸다(무인 리뷰 3R · 2026-07-31). 규율 2 는 "발화는 verbatim" 이다.

  - id: B1-talk-while-running
    prompt: "이 기능 elanous 가 스스로 구현하게 하고, 도는 동안 무슨 일 있는지 계속 알려줘"
    asserts:
      tool_min: { SelfImplement: 1 }

  - id: B3-judge-stuck-child
    prompt: "구현시키고, 자식이 막히면 알아서 판단해서 처리해줘. 못 풀겠으면 나한테 올려."
    asserts:
      tool_min: { SelfImplement: 1 }

  # ⛔⛔ B2 는 이 파일에서 **실행하지 않는다** — 계측기가 다르다.
  #    "아까 그거"의 지시대명사 해소는 직전 턴과 세션이 이어져야 재는데
  #    repro 의 prompts 는 서로 독립이다. 여기 넣으면 "잰 것처럼" 보이면서
  #    실제로는 아무것도 못 재는 거짓 통과가 나온다(문항집의 가장 나쁜 실패).
  #    ⇒ 문항은 문서(§B2)에 있고, 실행은 사다리 B2 층에서 한다
  #      (⭐ 계측기는 문서 §2-3 이 canonical — `attach` 보다 한 층 아래를 먼저 쓴다).
  #    ⛔ 여기에 발화를 옮겨 적지 않는다 — 사본이 둘이면 갈린다(위 A5 주석과 같은 이유).
  #    회차 기록표에는 그 결과를 같은 행에 적는다.

  # ── stage 3 — 진짜 elanous TUI 자식 PTY ──────────────────────────────────
  - id: C1-spawn-child-tui
    prompt: "elanous 하나 더 띄워서 지금 화면 보여줘"
    asserts:
      tool_min: { PtyShellStart: 1 }

  - id: C2-frame-focus-investigation
    prompt: "액자 환경에서 인풋창이 프롬프트 간에 포커스가 사라지는 현상이 있는지 확인해줘"
    asserts:
      # ⭐ Send ≥2 가 이 문항의 핵심 — "프롬프트 간"은 1회로 물리적으로 못 잰다(R5).
      tool_min: { PtyShellStart: 1, PtyShellSend: 2 }

  - id: C3-two-children-defer-reduce
    prompt: "elanous 두 개 띄워서 같은 걸 다르게 시켜보고, 오래 걸리면 기다렸다 다시 보고, 결론만 알려줘"
    asserts:
      tool_min: { PtyShellStart: 2 }
