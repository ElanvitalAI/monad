name: build-workflow
description: |
  Use when: User wants to author a brand-new workflow YAML for their
            current project or global library.
  Triggers: "build workflow", "new workflow", "워크플로우 만들어줘",
            "workflow builder".
  Does: Scans the existing workflow library + project tree,
        extracts a structured intent, generates a complete YAML
        following the project's "Use when / Triggers / Does / NOT for"
        convention, validates it, and (with user approval) saves it
        to ~/.monad/workflows/.
  NOT for: Editing an existing workflow (use the PWA YAML editor at
           /workflows or `monad workflow show <name>` + your editor).

# model hints (sonnet / haiku) resolve to Anthropic when that's the
# user's provider; non-Anthropic providers fall back to their own
# default model.
model: sonnet

nodes:
  - id: scan-codebase
    bash: |
      echo "=== Existing workflows ==="
      ls -1 ~/.monad/workflows 2>/dev/null | grep -E '\.ya?ml$' | head -20 || echo "(none)"
      echo ""
      echo "=== Project workflows ==="
      ls -1 .monad/workflows 2>/dev/null | grep -E '\.ya?ml$' | head -20 || echo "(none)"
      echo ""
      echo "=== Built-in samples ==="
      ls -1 samples/workflows 2>/dev/null | head -20 || echo "(none)"
      echo ""
      echo "=== CFT methods (cft node candidates) ==="
      ls -1 src/cft/*.ts 2>/dev/null | xargs -I{} basename {} .ts | head -10 || echo "(no src/cft)"
      echo ""
      echo "=== Project context (CLAUDE.md / AGENTS.md head) ==="
      head -40 CLAUDE.md 2>/dev/null || true
      echo ""
      head -20 AGENTS.md 2>/dev/null || true

  - id: extract-intent
    prompt: |
      You are a workflow design classifier. Given a user's description
      of what they want a new workflow to do, extract structured intent.

      ## User's Request
      $ARGUMENTS

      ## Codebase Context
      $scan-codebase.output

      ## Output requirements
      Respond with JSON only — no prose, no code fences. Schema:
      {
        "workflow_name": kebab-case slug,
        "description_lines": {
          "use_when": "1-sentence trigger condition",
          "triggers": "comma-separated phrases the router should match",
          "does": "1-sentence outcome",
          "not_for": "1-sentence anti-scope"
        },
        "nodes": [ { "id": kebab, "type": "prompt|bash|skill|cft|approval", "purpose": "<10 words" } ]
      }
    model: haiku
    allowed_tools: []
    output_format:
      type: object
      required: [workflow_name, description_lines, nodes]
    depends_on: [scan-codebase]

  - id: generate-yaml
    prompt: |
      You are an Archon-style monad workflow author. Generate a
      complete, valid workflow YAML based on the structured intent
      provided. Write the result to $ARTIFACTS_DIR/generated.yaml
      using the Bash tool's tee or printf — do NOT use Write/Edit.

      ## Intent (from extract-intent)
      $extract-intent.output

      ## Original user request
      $ARGUMENTS

      ## Schema reference (must conform — see samples/workflows/*.yaml
      ## in the source tree for canonical examples):

          name: <kebab-case>
          description: |
            Use when: …
            Triggers: …
            Does: …
            NOT for: …
          provider: claude          # or codex / gemini
          model: sonnet             # or haiku / opus
          nodes:
            - id: <kebab>
              # exactly one of: prompt | bash | skill | cft | approval
              prompt: |             # OR bash: | OR skill: <slug> OR cft: <method>
                ...
              # optional shared:
              depends_on: [other-id]
              when: "$other.output == 'X'"
              trigger_rule: all_success | one_success | all_done
              allowed_tools: [Read, Bash]
              denied_tools: [Edit]
              output_format: { type: object }   # for prompt nodes that need JSON
              model: haiku                       # node-level override
              idle_timeout: 60000                # bash only

      ## Rules
      1. workflow_name = $extract-intent.output.workflow_name (verbatim)
      2. description body MUST follow the "Use when / Triggers / Does
         / NOT for" 4-line pattern
      3. Every node id is unique kebab-case
      4. Every depends_on edge resolves
      5. Use bash for deterministic ops, prompt for AI reasoning,
         approval for risky human gates, skill for reusable logic
      6. If a prompt node feeds JSON to the next node, set
         output_format and reference $node.output.field downstream
    denied_tools: [Edit]
    depends_on: [extract-intent]

  - id: validate-yaml
    bash: |
      set -e
      FILE="$ARTIFACTS_DIR/generated.yaml"
      if [ ! -f "$FILE" ]; then
        echo "ERROR: generate-yaml did not create \$ARTIFACTS_DIR/generated.yaml"
        exit 1
      fi
      monad wf validate "$FILE"
    depends_on: [generate-yaml]
    idle_timeout: 30000

  - id: confirm-save
    approval:
      message: "Save the generated workflow to ~/.monad/workflows/? (Enter to approve, type 'no' to skip)"
      capture_response: true
    depends_on: [validate-yaml]

  - id: install
    bash: |
      set -e
      FILE="$ARTIFACTS_DIR/generated.yaml"
      if echo "$confirm-save.output" | grep -qi '^no$'; then
        echo "skipped — workflow stayed at $FILE"
        exit 0
      fi
      mkdir -p "$HOME/.monad/workflows"
      NAME=$(grep '^name:' "$FILE" | head -1 | sed 's/^name:[[:space:]]*//' | tr -d '"' )
      DEST="$HOME/.monad/workflows/$NAME.yaml"
      cp "$FILE" "$DEST"
      echo "installed → $DEST"
    depends_on: [confirm-save]
