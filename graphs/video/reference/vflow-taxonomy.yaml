# 🎬 AI 영상 프롬프트 «분류축» — vflow.live 코퍼스가 «스스로» 센 값
#
# ⛔⭐ 이 파일은 ***내가 추론한 분류가 아니다.*** 사이트가 `/technique/` 에 자기 코퍼스(9,796 프롬프트)를
#   세어 publish 한 **38 terms** 를 그대로 옮긴 것이다. 축 이름도 그쪽 것이다.
#   🔑 ***분류를 내가 지으면 내 편견이 들어가고, 그것을 잴 방법이 없다.***
#
# 📏 재는 명령 (⛔ 아래 수를 인용하지 마라 — 코퍼스는 «매일» 갱신된다고 사이트가 적었다):
#   curl -s -A 'Mozilla/5.0' https://vflow.live/technique/ | \
#     python3 -c "import re,sys;h=sys.stdin.read();\
#     [print(re.sub(r'<[^>]+>','',p.split('</h2>')[0]).strip(), '→',
#            re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',p.split('</h2>',1)[1].split('<h2')[0]))[:200])
#      for p in re.split(r'<h2[^>]*>', h)[1:]]"
#
# ⭐ 왜 이것이 이 저장소에 있나 — 대표 지시(2026-09-23) *"각종 모델별 프롬프트 … DB 화 할 필요"*.
#   원본 전량(9,947 URL · 스키마 아래)은 저장소 «밖»이다 — `~/docs/ref/vflow/prompts.ndjson`
#   (수집기 = `scripts/vflow-collect.ts`). ***여기엔 「필터링 가능한 구조」만 둔다.***
#   🔑 근거: 이 라이브러리를 소개한 포스트의 결론이 *"대용량 미정렬보다 «필터링 가능한» 레퍼런스가 낫다"* 였다.
#
# 🧩 이 저장소의 축과 어떻게 만나나 (⛔ 아직 «배선은 안 됐다» — RFC §3 recipe 바인딩의 재료다)
#   aspect_ratio  →  `deliver` 노드의 target_specs · `reframe` 레시피
#   duration      →  `align` 노드(길이 권한) — ⚠️ 이 축에서 2026-09-22 에 -shortest 결함을 고쳤다
#   camera/lighting/mood → `plan`·`directed-shots` 레시피의 «프롬프트 어휘»
#   format        →  ⭐ «능력 사슬»이다: image-to-video 는 image-gen → video-gen 을 잇는다
#
source: https://vflow.live/technique/
corpus: 9796            # 사이트가 말한 수 (2026-09-23). ⛔ 내가 센 URL 은 9947 — 다른 값이다(번역판 제외 영문 URL)
