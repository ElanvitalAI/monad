# 대표 이 준 예시 그대로 — RFC §4.2 의 `plan-then-implement` 자리.
# ⛔ node_id 는 «불투명 식별자»다. 의미는 `recipe` 가 진다 — 같은 recipe 를 여러 노드가 쓸 수 있다.
graph_id: plan-loop
version: 2
entry_node: t_plan01
terminal_nodes:
  - t_impl01
nodes:
  - node_id: t_plan01
    kind: agent
    recipe: planning
    max_visits: 6
  - node_id: t_prev01
    kind: agent
    recipe: plan_review
    max_visits: 3
  - node_id: t_pjdg01
    kind: agent
    recipe: plan_judge
    max_visits: 3
  - node_id: t_impl01
    kind: agent
    recipe: implementation
    max_visits: 6
edges:
  - from: t_plan01
    to: t_prev01
  - from: t_prev01
    on: outcome
    map:
      pass: t_pjdg01
      fail: t_plan01
  - from: t_pjdg01
    on: outcome
    map:
      pass: t_impl01
      fail: t_plan01
